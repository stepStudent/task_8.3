<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Реєстрація на онлайн-курс</title>
  <meta name="description" content="Форма реєстрації на онлайн-курс: контакти, напрям, формат навчання та додаткові інтереси.">
  <style>
    :root {
      --ink: #1e2235;
      --muted: #667085;
      --accent: #5b5bd6;
      --accent-dark: #4646b8;
      --accent-soft: #eef0ff;
      --border: #dfe3ee;
      --surface: #ffffff;
      --ring: rgba(91, 91, 214, .25);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      color: var(--ink);
      line-height: 1.55;
      background:
        radial-gradient(900px 500px at 8% -10%, #dfe4ff 0%, transparent 60%),
        radial-gradient(700px 420px at 110% 8%, #d8f4ee 0%, transparent 55%),
        #f5f6fb;
    }

    .page {
      width: min(100%, 780px);
      margin: 0 auto;
      padding: 40px 20px 32px;
    }

    .card {
      padding: clamp(24px, 4vw, 44px);
      background: rgba(255, 255, 255, .92);
      border: 1px solid rgba(255, 255, 255, .8);
      border-radius: 24px;
      box-shadow: 0 24px 60px -24px rgba(38, 42, 80, .28);
    }

    .hero {
      margin-bottom: 28px;
    }

    .eyebrow {
      margin: 0 0 8px;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--accent);
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.6rem, 4vw, 2.15rem);
      line-height: 1.2;
      letter-spacing: -.02em;
    }

    .lead {
      max-width: 52ch;
      margin: 0;
      color: var(--muted);
    }

    .form {
      display: grid;
      gap: 22px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    label,
    legend {
      font-size: .95rem;
      font-weight: 600;
    }

    .required-mark {
      color: #e5484d;
    }

    input,
    select,
    textarea {
      font: inherit;
      color: inherit;
    }

    input[type="text"],
    input[type="email"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      padding: 12px 14px;
      background: #fbfcff;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    }

    input::placeholder,
    textarea::placeholder {
      color: #98a2b3;
    }

    input:hover,
    select:hover,
    textarea:hover {
      border-color: #c6cce2;
    }

    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      background: #fff;
      border-color: var(--accent);
      outline: none;
      box-shadow: 0 0 0 4px var(--ring);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .hint {
      margin: 0;
      font-size: .8rem;
      color: var(--muted);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    @media (max-width: 560px) {
      .row {
        grid-template-columns: 1fr;
      }
    }

    .group {
      margin: 0;
      padding: 16px 18px 18px;
      background: #fbfcff;
      border: 1.5px solid var(--border);
      border-radius: 16px;
    }

    .group legend {
      padding: 0 8px;
    }

    .options {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .option {
      position: relative;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    .option label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 120px;
      padding: 10px 18px;
      font-weight: 600;
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: 999px;
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease, color .15s ease, box-shadow .15s ease;
    }

    .option label:hover {
      border-color: #c6cce2;
    }

    .sr-only:checked + label {
      color: var(--accent-dark);
      background: var(--accent-soft);
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--accent);
    }

    .sr-only:focus-visible + label {
      box-shadow: 0 0 0 4px var(--ring);
    }

    .check {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      font-size: .92rem;
      font-weight: 500;
      background: #fff;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease;
    }

    .check:hover {
      border-color: #c6cce2;
    }

    .check input {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: var(--accent);
    }

    .check:has(input:checked) {
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
      padding-top: 4px;
    }

    .submit {
      padding: 13px 28px;
      font: inherit;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      background: linear-gradient(135deg, #5b5bd6, #7c5cf0);
      border: 0;
      border-radius: 999px;
      box-shadow: 0 14px 30px -12px rgba(91, 91, 214, .65);
      transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
    }

    .submit:hover {
      transform: translateY(-1px);
      filter: brightness(1.05);
    }

    .submit:active {
      transform: translateY(0);
    }

    .submit:focus-visible {
      outline: none;
      box-shadow: 0 0 0 4px var(--ring), 0 14px 30px -12px rgba(91, 91, 214, .65);
    }

    .note {
      max-width: 34ch;
      margin: 0;
      font-size: .8rem;
      color: var(--muted);
    }

    .footer {
      margin-top: 20px;
      font-size: .8rem;
      text-align: center;
      color: #98a2b3;
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card" aria-labelledby="page-title">
      <header class="hero">
        <p class="eyebrow">Навчальний центр</p>
        <h1 id="page-title">Реєстрація на онлайн-курс</h1>
        <p class="lead">Заповніть форму, і ми надішлемо вам програму курсу та умови навчання.</p>
      </header>

      <form class="form" action="#" method="get">
        <div class="field">
          <label for="fullName">Ім'я та прізвище <span class="required-mark" aria-hidden="true">*</span></label>
          <input type="text" id="fullName" name="fullName" autocomplete="name" placeholder="Олена Ковальчук" minlength="2" required>
        </div>

        <div class="field">
          <label for="email">Email <span class="required-mark" aria-hidden="true">*</span></label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="olena@example.com" required>
        </div>

        <div class="row">
          <div class="field">
            <label for="age">Вік <span class="required-mark" aria-hidden="true">*</span></label>
            <input type="number" id="age" name="age" min="14" max="99" step="1" inputmode="numeric" placeholder="18" required>
            <p class="hint">Від 14 до 99 років.</p>
          </div>

          <div class="field">
            <label for="direction">Напрям навчання <span class="required-mark" aria-hidden="true">*</span></label>
            <select id="direction" name="direction" required>
              <option value="" disabled selected>Оберіть напрям</option>
              <option value="frontend">Frontend-розробка</option>
              <option value="python">Python-розробка</option>
              <option value="design">UI/UX-дизайн</option>
              <option value="data">Аналітика даних</option>
              <option value="qa">Тестування QA</option>
            </select>
          </div>
        </div>

        <fieldset class="group">
          <legend>Формат навчання <span class="required-mark" aria-hidden="true">*</span></legend>
          <div class="options">
            <div class="option">
              <input class="sr-only" type="radio" id="online" name="format" value="online" required>
              <label for="online">Онлайн</label>
            </div>
            <div class="option">
              <input class="sr-only" type="radio" id="offline" name="format" value="offline" required>
              <label for="offline">Офлайн</label>
            </div>
          </div>
        </fieldset>
        <fieldset class="group">
          <legend>Додаткові інтереси</legend>
          <div class="options">
            <label class="check">
              <input type="checkbox" id="interest-projects" name="interests" value="projects">
              <span>Проєктна робота</span>
            </label>
            <label class="check">
              <input type="checkbox" id="interest-mentor" name="interests" value="mentor">
              <span>Підтримка ментора</span>
            </label>
            <label class="check">
              <input type="checkbox" id="interest-career" name="interests" value="career">
              <span>Кар'єрні консультації</span>
            </label>
            <label class="check">
              <input type="checkbox" id="interest-certificate" name="interests" value="certificate">
              <span>Сертифікат</span>
            </label>
          </div>
        </fieldset>
        

        <div class="field">
          <label for="comment">Коментар</label>
          <textarea id="comment" name="comment" rows="4" maxlength="500" placeholder="Ваші запитання або побажання"></textarea>
        </div>

        <div class="actions">
          <button type="submit" class="submit">Зареєструватися</button>
          <p class="note">Натискаючи кнопку, ви погоджуєтесь на обробку даних.</p>
        </div>
      </form>
    </section>
    <footer class="footer">
      <p>© 2026 Навчальний центр. Усі права захищені.</p>
    </footer>
  </main>
</body>
</html>
